name: publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A push while a deploy is running waits for it, so two Pages deploys never overlap.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_DIR: build/webgl
  # The same build scripts/fetch-godot.sh pins; the action wants it without "-stable".
  GODOT_VERSION: 4.7.2
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        name: Setup Godot
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0  # no moving major tag on this action

      - name: Install gdtoolkit
        run: uv tool install gdtoolkit==${{ env.GDTOOLKIT_VERSION }}

      - name: Lint
        run: scripts/lint.sh

      - name: Test
        env:
          GODOT_BIN: godot
        run: scripts/test.sh

  build-webgl:
    name: export web build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        name: Setup Godot
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Setup
        run: godot --version

      - name: Export Web
        env:
          GODOT_BIN: godot
        # scripts/godot-env.sh keeps Godot's data under .tools/ for sandboxes; the action
        # installed the export templates in the runner's real data directory, so point
        # Godot back at it here.
        run: |
          export XDG_DATA_HOME="$HOME/.local/share"
          scripts/export-web.sh

      # Pages publishes this directory as the site root. deploy-pages picks the
      # artifact up by its default name; this job does not need to download it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_DIR }}

  deploy-pages:
    name: deploy to GitHub Pages
    needs: build-webgl
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's, so these two are the whole set.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
